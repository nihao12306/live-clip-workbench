name: Windows x64 installer

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_tag:
        description: Tag to build during release recovery
        required: false
        type: string
      media_baseline:
        description: Previous Windows release to reuse verified media binaries from
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install JavaScript dependencies
        shell: pwsh
        run: |
          $env:FFMPEG_BIN = (Get-Command cmd.exe).Source
          npm.cmd ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@v2
        if: inputs.media_baseline == ''
        with:
          msystem: UCRT64
          update: true
          install: >-
            make curl tar gzip xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
      - name: Build native media tools and include their sources
        if: inputs.media_baseline == ''
        shell: msys2 {0}
        run: bash .github/scripts/build-media-tools.sh
      - name: Reuse verified media binaries and corresponding sources
        if: inputs.media_baseline != ''
        env:
          BASELINE: ${{ inputs.media_baseline }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASELINE -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid media baseline tag' }
          $version = $env:BASELINE.Substring(1)
          $assetName = "live-clip-workbench-$version-win-x64.exe"
          $api = "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:BASELINE"
          $published = gh api $api | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $asset = $published.assets | Where-Object { $_.name -eq $assetName -and $_.state -eq 'uploaded' }
          if (-not $asset -or $asset.digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Prior media package has no verified digest' }
          $baseline = Join-Path $env:RUNNER_TEMP 'prior-installer.exe'
          gh release download $env:BASELINE --repo $env:GITHUB_REPOSITORY --pattern $assetName --output $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (('sha256:' + (Get-FileHash $baseline).Hash) -ne $asset.digest) { throw 'Prior installer digest mismatch' }
          $install = Join-Path $env:RUNNER_TEMP 'prior-release'
          $setup = Start-Process -FilePath $baseline -ArgumentList "/S /D=$install" -WindowStyle Hidden -PassThru
          if (-not $setup.WaitForExit(90000) -or $setup.ExitCode -ne 0) { throw 'Could not unpack media from the prior installer' }
          $unpacked = Join-Path $install 'resources/app.asar.unpacked'
          $tools = Join-Path $unpacked 'media-tools'
          if (-not (Test-Path (Join-Path $tools 'ffmpeg-corresponding-source.tar.gz'))) { throw 'Missing prior media sources' }
          Copy-Item -LiteralPath $tools -Destination media-tools -Recurse
          Copy-Item (Join-Path $unpacked 'node_modules/ffmpeg-static/ffmpeg.exe') node_modules/ffmpeg-static/ffmpeg.exe -Force
          $ffprobeDir = 'node_modules/ffprobe-static/bin/win32/x64'
          New-Item -ItemType Directory -Path $ffprobeDir -Force | Out-Null
          Copy-Item (Join-Path $unpacked 'node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe') $ffprobeDir -Force
      - name: Build the Windows installer
        shell: pwsh
        run: |
          npm.cmd run dist -- --win nsis --x64 --publish never
          exit $LASTEXITCODE
      - name: Verify the installed application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release -Filter '*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $installer = $installers[0]
          $installed = Join-Path $env:RUNNER_TEMP 'live-clip-workbench-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installed" -WindowStyle Hidden -PassThru
          if (-not $setup.WaitForExit(90000)) { Stop-Process -Id $setup.Id; throw 'Installer timed out' }
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $app = Get-ChildItem -LiteralPath $installed -Filter '*.exe' -File | Where-Object Name -NotLike 'Uninstall*' | Select-Object -First 1
          if (-not $app) { throw 'Installed application not found' }
          $unpacked = Join-Path $installed 'resources/app.asar.unpacked'
          $ffmpeg = Join-Path $unpacked 'node_modules/ffmpeg-static/ffmpeg.exe'
          $ffprobe = Join-Path $unpacked 'node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe'
          foreach ($tool in $ffmpeg, $ffprobe) {
            $config = & $tool -buildconf 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $config -match '--enable-nonfree') { throw "Invalid media executable: $tool" }
          }
          if (-not (Test-Path (Join-Path $unpacked 'media-tools/ffmpeg-corresponding-source.tar.gz'))) { throw 'Missing media sources' }
          & $ffmpeg -v error -f lavfi -i color=size=160x120:rate=25 -t 1 -c:v libx264 release/media-test.mp4
          if ($LASTEXITCODE -ne 0) { throw 'H.264 encoding failed' }
          $codec = & $ffprobe -v error -show_entries stream=codec_name -of csv=p=0 release/media-test.mp4
          if ($LASTEXITCODE -ne 0 -or $codec -ne 'h264') { throw 'Media probing failed' }
          $filters = & $ffmpeg -filters 2>&1 | Out-String
          if ($filters -notmatch '\bsubtitles\b' -or $filters -notmatch '\bdrawtext\b') { throw 'Missing subtitle or text filter' }
          $stdout = Join-Path $env:RUNNER_TEMP 'workbench-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'workbench-stderr.log'
          $process = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(40000)) { Stop-Process -Id $process.Id; Get-Content $stderr; throw 'Application startup timed out' }
          Get-Content $stdout,$stderr
          if ($process.ExitCode -ne 0 -or -not (Select-String -LiteralPath $stdout -SimpleMatch 'SMOKE_TEST_READY' -Quiet)) {
            throw 'Installed application smoke test failed'
          }
          $digest = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            release/*-win-x64.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

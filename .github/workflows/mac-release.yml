name: Publish Windows and Apple Silicon installers

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  mac:
    name: macOS arm64
    runs-on: macos-15
    timeout-minutes: 35
    env:
      TARGET_ARCH: arm64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build disk image
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          FFMPEG_BIN=/usr/bin/true npm ci
          for tool in meson ninja nasm pkg-config; do
            command -v "$tool" >/dev/null || brew install "$tool"
          done
          bash .github/scripts/build-media-tools.sh
          test "$(node -p process.arch)" = "$TARGET_ARCH"
          npm run build
          npx --no-install electron-builder --mac dmg --"$TARGET_ARCH" --publish never
      - name: Verify disk image and launch the packaged app
        run: |
          set -euo pipefail
          dmg=(release/*-mac-"$TARGET_ARCH".dmg)
          test "${#dmg[@]}" = 1
          hdiutil verify "${dmg[0]}"
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmg[0]}"
          trap 'hdiutil detach "$mount_dir"' EXIT
          app=("$mount_dir"/*.app)
          test "${#app[@]}" = 1
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "${app[0]}/Contents/Info.plist")"
          test "$(lipo -archs "${app[0]}/Contents/MacOS/$executable")" = "$TARGET_ARCH"
          resources="${app[0]}/Contents/Resources/app.asar.unpacked/node_modules"
          ffmpeg="$resources/ffmpeg-static/ffmpeg"
          ffprobe="$resources/ffprobe-static/bin/darwin/$TARGET_ARCH/ffprobe"
          for tool in "$ffmpeg" "$ffprobe"; do
            test "$(lipo -archs "$tool")" = "$TARGET_ARCH"
            "$tool" -buildconf > release/media-build.txt 2>&1
            if grep -q -- '--enable-nonfree' release/media-build.txt; then exit 1; fi
            otool -L "$tool" | tail -n +2 | awk '$1 !~ /^\/(usr\/lib|System\/Library)\// { bad = 1 } END { exit bad }'
          done
          test -s "$resources/../media-tools/ffmpeg-corresponding-source.tar.gz"
          "$ffmpeg" -v error -f lavfi -i color=size=160x120:rate=25 -t 1 -c:v libx264 release/media-test.mp4
          "$ffprobe" -v error -show_entries stream=codec_name -of csv=p=0 release/media-test.mp4 | grep -qx h264
          "$ffmpeg" -filters > release/media-filters.txt 2>&1
          grep -qw subtitles release/media-filters.txt
          grep -qw drawtext release/media-filters.txt
          python3 -c 'import subprocess,sys; p=subprocess.run([sys.argv[1], "--smoke-test", "--screenshot=release/mac-smoke.png"], capture_output=True, text=True, timeout=45); print(p.stdout); print(p.stderr, file=sys.stderr); sys.exit(0 if p.returncode == 0 and "SMOKE_TEST_READY" in p.stdout else 1)' "${app[0]}/Contents/MacOS/$executable"
          test -s release/mac-smoke.png
          (cd release && shasum -a 256 *-mac-"$TARGET_ARCH".dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: mac-release-arm64
          path: |
            release/*-mac-arm64.dmg
            release/SHA256SUMS.txt
            release/mac-smoke.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    uses: ./.github/workflows/windows-release.yml

  release:
    name: Publish verified installers
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          prefix="live-clip-workbench-$version"
          arm="packages/mac-release-arm64/$prefix-mac-arm64.dmg"
          windows="packages/windows-x64/$prefix-win-x64.exe"
          for directory in packages/mac-release-arm64 packages/windows-x64; do
            (cd "$directory" && sha256sum -c SHA256SUMS.txt)
          done
          cat > release-notes.md <<'EOF'
          - Windows x64 下载 EXE 安装程序。
          - Mac Apple 芯片（M 系列）下载 arm64 DMG，将工作台拖入「应用程序」。

          文字选稿支持先选「值得做」或「不值得做」，再填写理由并保存。学习回执记录哪些反馈实际随初选、复审和最终择优请求发送并收到模型回复。
          场次历史可删除单条记录和对应的本机稿件及逐字稿。

          社区版使用 GitHub Releases 检查更新。收到提醒后可在应用内下载并打开 DMG。
          Mac 安装包未做 Apple Developer ID 签名或公证。
          EOF
          releases="repos/$GITHUB_REPOSITORY/releases"
          find_release_id() {
            gh api --paginate "$releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"
          }
          release_id="$(find_release_id)"
          if [ -z "$release_id" ]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "直播切片工作台 $version · Windows 和 macOS" --notes-file release-notes.md
            release_id="$(find_release_id)"
          fi
          test -n "$release_id"
          release="$releases/$release_id"
          for file in "$arm" "$windows"; do
            name="$(basename "$file")"
            checksum="$(sha256sum "$file" | cut -d' ' -f1)"
            asset_filter=".[] | select(.name == \"$name\")"
            existing="$(gh api "$release/assets" --jq "$asset_filter | .id")"
            if [ -z "$existing" ]; then
              test "$(gh api "$release" --jq .draft)" = true
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$file"
            fi
            actual="$(gh api "$release/assets" --jq "$asset_filter | select(.state == \"uploaded\") | .digest")"
            test "$actual" = "sha256:$checksum"
          done
          if [ "$(gh api "$release" --jq .draft)" = true ]; then
            gh api --method PATCH "$release" -F draft=false -f make_latest=true --jq .html_url
          fi
